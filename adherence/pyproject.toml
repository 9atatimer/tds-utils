[project]
name = "adherence"
version = "0.1.0"
description = "Architectural adherence engine (docs/design/DESIGN.ARCH-ADHERENCE.md)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "click>=8.1",
    "grimp>=3.5",
    "lizard>=1.24.1",
    "markdown-it-py>=4.0",
]

[project.scripts]
adhere = "adherence.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

# tests/fixtures/ holds trees the engine measures, some deliberately
# flawed (task-057 onward): never collected, linted or type-checked.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/fixtures"
markers = [
    "integration: asks a real external service (the judge); skipped unless configured",
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["adherence"]
exclude = ["tests/fixtures/"]

# boto3 and botocore ship no type information, and their stubs are not on
# the radar: the warehouse adapter types the one client surface it calls
# with a Protocol, and the S3 fake the signer calls it makes.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
