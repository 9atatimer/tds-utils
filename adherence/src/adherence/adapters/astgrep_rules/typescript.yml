# TypeScript and JavaScript structural facts for adapters/astgrep.py.
#
# Written for TypeScript; the adapter runs a copy as Tsx, which also reads
# JavaScript. Each rule's id names the fact it yields and its captures are
# the fact's parts; an id may carry a `.variant` when two rules yield one
# fact. Every rule is a hint, so a match never fails the scan.
id: function
language: TypeScript
severity: hint
rule:
  any:
    - all:
        - any:
            - kind: function_declaration
            - kind: generator_function_declaration
        - has: {field: name, pattern: $NAME}
    - all:
        - kind: method_definition
        - inside: {kind: class_body}
        - has: {field: name, pattern: $NAME}
    - all:
        - any:
            - kind: arrow_function
            - kind: function_expression
            - kind: generator_function
        - any:
            - inside:
                kind: variable_declarator
                has: {field: name, kind: identifier, pattern: $NAME}
            - inside:
                kind: public_field_definition
                has: {field: name, pattern: $NAME}
---
id: type
language: TypeScript
severity: hint
rule:
  any:
    - kind: class_declaration
    - kind: abstract_class_declaration
    - kind: interface_declaration
    - kind: type_alias_declaration
  has: {field: name, pattern: $NAME}
---
id: import
language: TypeScript
severity: hint
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    kind: string
    has: {kind: string_fragment, pattern: $SOURCE}
---
id: import.call
language: TypeScript
severity: hint
rule:
  kind: call_expression
  has:
    field: function
    any:
      - regex: '^require$'
      - kind: import
  all:
    - has:
        field: arguments
        has:
          kind: string
          nthChild: 1
          has: {kind: string_fragment, pattern: $SOURCE}
---
id: function-node
language: TypeScript
severity: hint
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
    - kind: function_expression
    - kind: generator_function
    - kind: arrow_function
    - kind: method_definition
---
id: parameter
language: TypeScript
severity: hint
rule:
  any:
    - all:
        - any:
            - kind: required_parameter
            - kind: optional_parameter
        - has: {field: pattern, pattern: $NAME}
    - all:
        - kind: identifier
        - inside: {kind: arrow_function, field: parameter}
        - pattern: $NAME
---
id: parameter-type
language: TypeScript
severity: hint
rule:
  any:
    - kind: required_parameter
    - kind: optional_parameter
  has: {field: type, pattern: $TYPE}
---
id: parameter-default
language: TypeScript
severity: hint
rule:
  any:
    - kind: optional_parameter
    - all:
        - kind: required_parameter
        - has: {field: value, pattern: $DEFAULT}
---
id: parameter-property
language: TypeScript
severity: hint
rule:
  any:
    - all:
        - kind: shorthand_property_identifier_pattern
        - pattern: $NAME
    - all:
        - kind: object_assignment_pattern
        - has: {field: left, pattern: $NAME}
    - all:
        - kind: pair_pattern
        - has: {field: key, pattern: $NAME}
  inside:
    kind: object_pattern
    inside:
      any:
        - kind: required_parameter
        - kind: optional_parameter
---
id: property-default
language: TypeScript
severity: hint
rule:
  kind: object_assignment_pattern
---
id: property-type
language: TypeScript
severity: hint
rule:
  kind: property_signature
  has: {field: name, pattern: $NAME}
  all:
    - has: {field: type, pattern: $TYPE}
---
id: returns
language: TypeScript
severity: hint
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
    - kind: function_expression
    - kind: generator_function
    - kind: arrow_function
    - kind: method_definition
  has: {field: return_type, pattern: $TYPE}
---
id: decorator
language: TypeScript
severity: hint
rule:
  kind: decorator
  has: {pattern: $NAME}
  inside:
    any:
      - kind: class_declaration
      - kind: abstract_class_declaration
---
id: decorator-next
language: TypeScript
severity: hint
rule:
  kind: decorator
  has: {pattern: $NAME}
  any:
    - inside: {kind: export_statement}
    - precedes:
        any:
          - kind: method_definition
          - kind: class_declaration
          - kind: abstract_class_declaration
        stopBy: {not: {kind: decorator}}
---
id: base
language: TypeScript
severity: hint
rule:
  pattern: $NAME
  all:
    - any:
        - kind: identifier
        - kind: member_expression
        - kind: call_expression
        - kind: type_identifier
        - kind: nested_type_identifier
        - kind: generic_type
  any:
    - inside: {kind: extends_clause, field: value}
    - inside: {kind: implements_clause}
    - inside: {kind: extends_type_clause}
---
id: body
language: TypeScript
severity: hint
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
    - kind: function_expression
    - kind: generator_function
    - kind: arrow_function
    - kind: method_definition
    - kind: class_declaration
    - kind: abstract_class_declaration
    - kind: interface_declaration
    - kind: type_alias_declaration
  all:
    - any:
        - has: {field: body, pattern: $BODY}
        - has: {field: value, pattern: $BODY}
---
id: stub
language: TypeScript
severity: hint
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
    - kind: function_expression
    - kind: generator_function
    - kind: arrow_function
    - kind: method_definition
  has:
    field: body
    kind: statement_block
    any:
      - regex: '^\{\s*\}$'
      - all:
          - has:
              kind: throw_statement
              has:
                kind: new_expression
                has: {field: constructor, pattern: $THROWN}
          - not: {has: {nthChild: 2}}
---
id: call
language: TypeScript
severity: hint
rule:
  any:
    - all:
        - kind: call_expression
        - has: {field: function, pattern: $CALLEE}
    - all:
        - kind: new_expression
        - has: {field: constructor, pattern: $CALLEE}
---
id: name
language: TypeScript
severity: hint
rule:
  kind: identifier
  not:
    any:
      - inside: {kind: member_expression, field: object}
      - inside: {kind: nested_identifier}
      - inside: {kind: nested_type_identifier}
      - inside: {kind: import_specifier}
      - inside: {kind: import_clause}
      - inside: {kind: namespace_import}
      - inside: {kind: export_specifier}
      - inside: {kind: required_parameter, field: pattern}
      - inside: {kind: optional_parameter, field: pattern}
      - inside: {kind: arrow_function, field: parameter}
      - inside: {kind: function_declaration, field: name}
      - inside: {kind: generator_function_declaration, field: name}
      - inside: {kind: function_expression, field: name}
      - inside: {kind: class_declaration, field: name}
      - inside:
          kind: variable_declarator
          field: name
          has:
            field: value
            any:
              - kind: arrow_function
              - kind: function_expression
              - kind: generator_function
---
id: name.type
language: TypeScript
severity: hint
rule:
  any:
    - kind: type_identifier
    - kind: nested_type_identifier
  not:
    any:
      - inside: {kind: nested_type_identifier}
      - inside: {kind: class_declaration, field: name}
      - inside: {kind: abstract_class_declaration, field: name}
      - inside: {kind: interface_declaration, field: name}
      - inside: {kind: type_alias_declaration, field: name}
---
id: name.chain
language: TypeScript
severity: hint
rule:
  kind: member_expression
  regex: '^[A-Za-z_$][\w$]*(\.#?[A-Za-z_$][\w$]*)+$'
  not:
    inside:
      kind: member_expression
      field: object
      regex: '^[A-Za-z_$][\w$]*(\.#?[A-Za-z_$][\w$]*)+$'
---
id: string
language: TypeScript
severity: hint
rule:
  any:
    - kind: string
    - kind: template_string
  not:
    any:
      - inside: {kind: import_statement}
      - inside: {kind: export_statement}
---
id: global
language: TypeScript
severity: hint
rule:
  kind: member_expression
  regex: '^globalThis\.'
  not: {inside: {kind: member_expression, field: object}}
---
id: write
language: TypeScript
severity: hint
rule:
  any:
    - kind: assignment_expression
    - kind: augmented_assignment_expression
  has:
    field: left
    kind: member_expression
    all:
      - has: {field: object, pattern: $OBJECT}
      - has: {field: property, pattern: $FIELD}
---
id: write.update
language: TypeScript
severity: hint
rule:
  kind: update_expression
  has:
    field: argument
    kind: member_expression
    all:
      - has: {field: object, pattern: $OBJECT}
      - has: {field: property, pattern: $FIELD}
