# Shell structural facts for adapters/astgrep.py.
#
# Written for Bash; the adapter claims every file handed to it, whatever
# its name, since a shell tool is often a bare name under bin/ and zsh is
# read with the Bash grammar. Each rule's id names the fact it yields, the
# same ids the TypeScript rules use, and its captures are the fact's
# parts; an id may carry a `.variant` when two rules yield one fact.
# Every rule is a hint, so a match never fails the scan.
id: function
language: Bash
severity: hint
rule:
  kind: function_definition
  has: {field: name, pattern: $NAME}
---
id: function-node
language: Bash
severity: hint
rule:
  kind: function_definition
---
# `source` or `.` with the file it reads, as written; the adapter says
# which source, if any, that is.
id: import
language: Bash
severity: hint
rule:
  kind: command
  has: {field: name, regex: '^(source|\.)$'}
  all:
    - has: {field: argument, pattern: $SOURCE}
---
id: body
language: Bash
severity: hint
rule:
  kind: function_definition
  has: {field: body, pattern: $BODY}
---
# A body, braced or a subshell, whose only command, comments aside, has no
# argument: the command's name, as written, is the form the shared code
# checks against the Vocabulary's stubs (`:`, the no-op); the adapter
# reads a quoted name as the name.
id: stub
language: Bash
severity: hint
rule:
  kind: function_definition
  has:
    field: body
    any: [{kind: compound_statement}, {kind: subshell}]
    all:
      - has:
          kind: command
          nthChild: {position: 1, ofRule: {not: {kind: comment}}}
          not: {has: {field: argument, regex: '.'}}
          has: {field: name, pattern: $THROWN}
      - not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
---
id: call
language: Bash
severity: hint
rule:
  kind: command
  has: {field: name, pattern: $CALLEE}
---
# The command `command` or `exec` runs: its first argument not an option.
id: call.wrapped
language: Bash
severity: hint
rule:
  kind: command
  has: {field: name, regex: '^(command|exec)$'}
  all:
    - has: {field: argument, kind: word, not: {regex: '^-'}, pattern: $CALLEE}
---
# The command `exec` runs past its options (`-c`, `-l`, `-a NAME`): the
# first argument that is neither an option nor the name `-a` gives, when
# an option comes before it.
id: call.exec
language: Bash
severity: hint
rule:
  kind: word
  pattern: $CALLEE
  inside:
    kind: command
    has: {field: name, regex: '^exec$'}
  all:
    - not: {regex: '^-'}
    - not: {follows: {regex: '^-[cl]*a$'}}
    - follows: {stopBy: end, regex: '^-'}
    - not:
        follows:
          stopBy: end
          kind: word
          all:
            - not: {regex: '^-'}
            - not: {follows: {regex: '^-[cl]*a$'}}
---
# A node the grammar could not read, but one it produces on valid shell:
# a heredoc's command run in the background (`cat <<EOF &`), whose `&` the
# grammar leaves as an error inside the heredoc redirect while reading the
# rest of the file. Only that lone `&` there is excused; any other error
# unparses the file.
id: syntax-error
language: Bash
severity: hint
rule:
  kind: ERROR
  not:
    all:
      - regex: '^&$'
      - inside: {kind: heredoc_redirect}
