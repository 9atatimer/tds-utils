# adherence.yml -- reusable workflow: the architectural adherence gate.
# Judges a change's head against its base with the adherence engine
# (`bin/adhere --stage ci judge`), writes the verdict, findings, notices and
# coverage to the job summary, and keeps the findings as a SARIF run
# artifact.
# Design: docs/design/DESIGN.ARCH-ADHERENCE.md; architecture:
# docs/design/ARCHITECTURE.ARCH-ADHERENCE.md (Where it runs, Persistence,
# Security mitigations, Operability).
#
# One job:
#
#   judge    contents: read and pull-requests: read. Fetches the engine at
#            `tools_ref`, checks the repository out at the head with full
#            history, installs the analyzers from their locks (uv.lock with
#            --frozen, node/package-lock.json with npm ci --ignore-scripts), and
#            runs one judgement that prints the report to the log and writes
#            the SARIF file and the job summary. The ci stage reads the
#            job's GITHUB_TOKEN for the reviews that settle which landed
#            adherence.toml is in force, and the hosted judge's gateway
#            URL and token and the ledger's configuration
#            and credentials, read from 1Password when the caller supplies
#            the service account (Credentials, below; without the judge's
#            token the judged checks are coverage and the verdict is
#            inconclusive at best). The engine hands every analyzer an
#            allowlisted environment (PATH, LANG, and HOME and TMPDIR set to
#            a scratch directory), so no token or credential reaches one;
#            only the decide client gets the judge's token, as its own
#            configuration, and only the warehouse adapter the ledger's. The verdict sets the job's exit status last:
#            lowered and not run fail, and inconclusive passes (the
#            design's Key Decisions, Inconclusive at the gate); the SARIF
#            is kept as a run artifact first either way (7 days), the
#            machine-readable report of the run.
#
# There is no code scanning upload. The workflow once had a second job that
# posted the SARIF to code scanning so findings annotated the diff; a
# private repository without GitHub's paid Code Security add-on refuses
# that upload ("Code Security must be enabled for this repository to use
# code scanning", template-tools PR#1058, run 42310085996, 2026-11-06) and
# the owner ruled the add-on out, so the annotations went with it. The
# verdict, the log report, the job summary and the SARIF artifact need no
# security-events permission and no add-on, on any repository.
#
# The bound: the ci stage has no deadline of its own. The judge step passes
# the job's remaining time -- `timeout_minutes` less the time already spent
# and a margin for the steps after it -- as `--time-left`; checks unfinished
# by then are coverage, never a pass.
#
# The base: by default, for a pull request, the merge-base of the head and
# the pull request's base, so a change is judged on what it did and not on
# what landed beside it; for a push, the tip the push replaced
# (`github.event.before`); for a new branch's first push or another event,
# the merge-base with the default branch. When none can be found (a force
# push whose old tip is not fetched, the default branch's first push) the
# job fails and says so rather than judge an empty change. A caller may
# name `base` and `head` instead (tedium's staging commit, say).
#
# Credentials: one secret, ADHERENCE_OP_SA_TOKEN, a read-only 1Password
# service account scoped to the adherence vault; everything else is an
# op:// item reference in a repository or owner VARIABLE, resolved at run
# time by the one step that sees the token (one secret per workflow
# family). Each value read is masked before anything is written, and
# reaches only the judge step's environment.
#
#   DECIDE_GATEWAY_OP_ITEM     the judge's run token, field `password`,
#                              and the gateway base, field `url` (it
#                              names the account, so it is masked like
#                              the token rather than kept in a variable)
#   ADHERENCE_LEDGER_OP_ITEM   the warehouse's scan credential: fields
#                              `username` (access key id), `password`
#                              (secret), `endpoint` and `bucket`
#   ADHERENCE_LEDGER_LOOKUP_OP_ITEM
#                              the lookup-write credential, fields
#                              `username` and `password` (Reports, below)
#
# A variable left unset turns its consumer off: no judge, or no warehouse.
# A variable that is set but cannot be read fails the job, since a
# configured judge that is silently not asked would pass every judged
# check as coverage. A same-repository pull request runs this workflow as
# it edits it, so anyone who can open one can read what the service
# account reads (the architecture's Q6): the vault holds only the judge's
# spend-capped token and the scan credential, never the lookup-write
# credential.
#
# Reports: ci keeps each report in the runner's per-user file cache, and
# reads no base back from it. With the scan credential (`ledger_region`
# defaults to R2's `auto`), every run also writes the report's scan key to
# the warehouse, and a base is read back from the warehouse's lookup key,
# which only a default-branch run writes. That run's lookup-write
# credential is read through the GitHub environment the caller names in
# `ledger_environment`, restricted to the default branch: the judge job
# enters it only on a push to the default branch, and there the
# environment's own ADHERENCE_OP_SA_TOKEN -- a second service account,
# granted the adherence vault and the lookup vault -- takes the place of
# the caller's (a reusable workflow's environment secret wins over a
# passed secret of the same name). Without the scan credential, or until
# tds-internal Issue#276 provisions the bucket, the report carries a
# notice that it was kept in the file cache only, and the base is always
# measured again.
#
# Hosted here because a public repository's reusable workflow can be called
# from both owners (the review-settled.yml and ocr-review.yml precedent).
# The engine is fetched at `tools_ref`: a reusable workflow cannot learn the
# commit it was called at, so the caller passes that commit again, and pins
# `uses:` and `tools_ref` together (the same SHA; tds-utils Issue#453 names
# the cost of two pins).
#
# Caller shape (this repository calls it from the `adherence-judge` job in
# dist-ci.yml, with `uses: ./.github/workflows/adherence.yml`):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   jobs:
#     adherence:
#       uses: 9atatimer/tds-utils/.github/workflows/adherence.yml@<sha>
#       permissions:
#         contents: read
#         pull-requests: read
#       with:
#         tools_ref: <the same sha>
#       secrets:
#         ADHERENCE_OP_SA_TOKEN: ${{ secrets.ADHERENCE_OP_SA_TOKEN }}
#
# (optional), with `ledger_environment: <environment>` under `with:` when
# the lookup-write credential is provisioned there -- a caller that also
# runs on push to the default branch, so that run writes the base.
#
# and the caller owner's variables CI_RUNS_ON (optional runner pool),
# and the op:// item variables (Credentials, above). Adoption
# also requires (architecture, Operability): an adherence.toml landed with
# the owner's approval, CODEOWNERS entries naming users for adherence.toml,
# the caller workflow and its pins, and branch protection that requires
# code-owner review and this check by name; the job joins `gate`'s `needs`
# only after one green run.
#
# The ci-magic toolkit line (template-tools DESIGN.CI-MAGIC-TOOLKIT.md): a
# repository whose ci.magic judge should quote the measurement adds, to its
# base-sourced .github/scripts/ci-magic-toolkit,
#
#   adherence  bin/adhere measure --json
#
# here, where bin/adhere is in the repository; elsewhere the argv names the
# launcher where that job put tds-utils. It is a program and its fixed
# arguments, never an interpreter, and `measure` binds the laptop stage,
# which asks no judge without the door's address.
#
# Caller-controlled text (inputs, refs) reaches a script only through env:,
# never through an expression inside a run: block.

name: adherence

on:
  workflow_call:
    inputs:
      tools_ref:
        description: The tds-utils commit to run the engine from; the same SHA the caller pins this workflow at.
        type: string
        required: true
      base:
        description: The revision judged against; empty is the merge-base of the head and the pull request's base, on a push the tip it replaced, else the merge-base with the default branch.
        type: string
        required: false
        default: ''
      head:
        description: The revision judged; empty is the pull request's head, or the pushed commit.
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: The judge job's timeout; the judgement is bounded by what is left of it.
        type: number
        required: false
        default: 9
      ledger_region:
        description: The adherence-ledger warehouse's region; empty is R2's `auto`.
        type: string
        required: false
        default: ''
      ledger_environment:
        description: The GitHub environment, restricted to the default branch, holding the lookup-write credential; the judge job enters it only on a push to the default branch. Empty writes no lookup key.
        type: string
        required: false
        default: ''
    secrets:
      ADHERENCE_OP_SA_TOKEN:
        description: The read-only 1Password service account for the adherence vault, which resolves the op:// item variables (Credentials, in the header); without it nothing is read, the judged checks are coverage and reports stay in the file cache. On a push to the default branch, the `ledger_environment` environment's own secret of this name takes its place.
        required: false

permissions:
  contents: read

jobs:
  judge:
    name: judge
    # The caller's CI_RUNS_ON pool when set, else hosted; a pull request
    # from a fork always runs hosted.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # The environment holding the lookup-write credential, entered only by a
    # push to the default branch; every other run enters none.
    environment: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.ledger_environment || '' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.judge.outputs.status }}
    steps:
      # The SARIF artifact's name is this call's own: a run that calls the
      # workflow twice (two callers' jobs, a matrix) gets two names, so the
      # artifacts do not collide.
      - name: Start the clock
        id: clock
        run: |
          {
            echo "started=$(date +%s)"
            echo "artifact=adherence-sarif-$GITHUB_RUN_ATTEMPT-$(od -An -tx1 -N8 /dev/urandom | tr -d ' \n')"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 9atatimer/tds-utils
          ref: ${{ inputs.tools_ref }}
          path: .adherence-tools
          persist-credentials: false
          sparse-checkout: |
            bin/adhere
            bin/decide
            lib/decide
            adherence
          sparse-checkout-cone-mode: false

      # Checking the repository out clears the workspace, and the engine and
      # its environment must not sit inside the checkout it measures.
      - name: Stage the engine
        run: mv .adherence-tools "$RUNNER_TEMP/adherence-tools"

      # Full history: the base, the head and the history of adherence.toml.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The workspace now holds the untrusted head, so neither setup action
      # may read it: uv's version is pinned here rather than taken from a
      # `required-version` the head could carry, its cache (whose glob and
      # directory setup-uv would read from the workspace) is off, and its
      # working directory is the staged engine; setup-node's automatic npm
      # cache, which reads the workspace's package.json, is off too.
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.19'
          enable-cache: false
          working-directory: ${{ runner.temp }}/adherence-tools/adherence

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # The analyzers are pinned by hash: a lock that disagrees fails here,
      # and no package's install script runs. It runs in the staged engine,
      # so no configuration file of the head's is discovered from the
      # working directory.
      - name: Install the analyzers
        working-directory: ${{ runner.temp }}/adherence-tools/adherence
        run: |
          uv sync --frozen --no-dev --project "$RUNNER_TEMP/adherence-tools/adherence"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/adherence-tools/adherence/node"

      - name: Resolve the revisions
        id: revisions
        env:
          BASE_INPUT: ${{ inputs.base }}
          HEAD_INPUT: ${{ inputs.head }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          no_base() {
            echo "adherence: no base to judge $head against: $1; name one with the base input" >&2
            exit 1
          }
          head="${HEAD_INPUT:-${PR_HEAD:-$GITHUB_SHA}}"
          head="$(git rev-parse --verify "${head}^{commit}")"
          if [ -n "$BASE_INPUT" ]; then
            base="$(git rev-parse --verify "${BASE_INPUT}^{commit}")"
          elif [ -n "$PR_BASE" ]; then
            base="$(git merge-base "$PR_BASE" "$head")" ||
              no_base "the pull request's base $PR_BASE shares no history with it"
          elif [ -n "$PUSH_BEFORE" ] && [ -n "${PUSH_BEFORE//0/}" ]; then
            # A push is judged against the tip it replaced; the merge-base
            # with the default branch would be the head itself there.
            base="$(git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}")" ||
              no_base "the pushed-over tip $PUSH_BEFORE is not in the fetched history (a force push?)"
          else
            # A new branch (before is all zeros) or another event: the
            # merge-base with the default branch.
            git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" >/dev/null ||
              no_base "the default branch origin/$DEFAULT_BRANCH is not fetched"
            base="$(git merge-base "origin/$DEFAULT_BRANCH" "$head")" ||
              no_base "it shares no history with origin/$DEFAULT_BRANCH"
            if [ "$base" = "$head" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              no_base "it is the tip of the default branch and no earlier tip was pushed over"
            fi
          fi
          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/$PR_NUMBER/head"
          else
            ref="$GITHUB_REF"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "judging $head against $base"

      # Before any credential: a runner with no 1Password CLI (a GitHub-hosted
      # one) gets the pinned one, only when there is a token to use it with.
      - name: Check for the 1Password CLI
        id: opcheck
        env:
          HAS_TOKEN: ${{ secrets.ADHERENCE_OP_SA_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && ! command -v op >/dev/null 2>&1; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the 1Password CLI
        if: steps.opcheck.outputs.install == 'true'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.40.0

      # The one step that sees the service account. Every value it reads is
      # masked before it is written; the values reach only the judge step.
      # Item references are caller variables, so they come in through env:.
      - name: Credentials
        id: creds
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ADHERENCE_OP_SA_TOKEN }}
          DECIDE_GATEWAY_OP_ITEM: ${{ vars.DECIDE_GATEWAY_OP_ITEM }}
          ADHERENCE_LEDGER_OP_ITEM: ${{ vars.ADHERENCE_LEDGER_OP_ITEM }}
          ADHERENCE_LEDGER_LOOKUP_OP_ITEM: ${{ vars.ADHERENCE_LEDGER_LOOKUP_OP_ITEM }}
          LOOKUP_RUN: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.ledger_environment != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "adherence: no ADHERENCE_OP_SA_TOKEN; the judged checks are coverage and reports stay in the file cache"
            exit 0
          fi
          # put <output> <item> <field> -- one field, masked, into an output.
          put() {
            local value
            value="$(op read "$2/$3")" || {
              echo "adherence: cannot read field '$3' of $2 (the variable naming the item is set, so this is a misconfiguration)" >&2
              exit 1
            }
            echo "::add-mask::${value}"
            echo "$1=${value}" >> "$GITHUB_OUTPUT"
          }
          if [ -n "${DECIDE_GATEWAY_OP_ITEM}" ]; then
            put decide_token "${DECIDE_GATEWAY_OP_ITEM}" password
            put decide_url "${DECIDE_GATEWAY_OP_ITEM}" url
          fi
          if [ -n "${ADHERENCE_LEDGER_OP_ITEM}" ]; then
            put ledger_endpoint "${ADHERENCE_LEDGER_OP_ITEM}" endpoint
            put ledger_bucket "${ADHERENCE_LEDGER_OP_ITEM}" bucket
            put ledger_key_id "${ADHERENCE_LEDGER_OP_ITEM}" username
            put ledger_secret "${ADHERENCE_LEDGER_OP_ITEM}" password
          fi
          if [ "${LOOKUP_RUN}" = true ] && [ -n "${ADHERENCE_LEDGER_LOOKUP_OP_ITEM}" ]; then
            put lookup_key_id "${ADHERENCE_LEDGER_LOOKUP_OP_ITEM}" username
            put lookup_secret "${ADHERENCE_LEDGER_LOOKUP_OP_ITEM}" password
          fi

      # The report is author-controlled text: the engine labels every log
      # line and strips control characters, and workflow commands are off
      # while it runs, so no line of it can act on the job.
      - name: Judge the change
        id: judge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DECIDE_GATEWAY_URL: ${{ steps.creds.outputs.decide_url }}
          DECIDE_GATEWAY_TOKEN: ${{ steps.creds.outputs.decide_token }}
          ADHERENCE_LEDGER_ENDPOINT: ${{ steps.creds.outputs.ledger_endpoint }}
          ADHERENCE_LEDGER_BUCKET: ${{ steps.creds.outputs.ledger_bucket }}
          ADHERENCE_LEDGER_REGION: ${{ inputs.ledger_region }}
          ADHERENCE_LEDGER_ACCESS_KEY_ID: ${{ steps.creds.outputs.ledger_key_id }}
          ADHERENCE_LEDGER_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.ledger_secret }}
          # The lookup-write pair: read only on a push to the default branch,
          # through the environment's service account (Credentials).
          ADHERENCE_LEDGER_LOOKUP_ACCESS_KEY_ID: ${{ steps.creds.outputs.lookup_key_id }}
          ADHERENCE_LEDGER_LOOKUP_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.lookup_secret }}
          UV_FROZEN: '1'
          BASE: ${{ steps.revisions.outputs.base }}
          HEAD: ${{ steps.revisions.outputs.head }}
          STARTED: ${{ steps.clock.outputs.started }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          # Seconds kept back for the steps after this one.
          MARGIN_SECONDS: '60'
        run: |
          set -uo pipefail
          sarif="$RUNNER_TEMP/adherence/adherence.sarif"
          mkdir -p "$(dirname "$sarif")"
          left=$(( TIMEOUT_MINUTES * 60 - ($(date +%s) - STARTED) - MARGIN_SECONDS ))
          if [ "$left" -lt 0 ]; then left=0; fi
          token="$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          status=0
          "$RUNNER_TEMP/adherence-tools/bin/adhere" --stage ci judge \
            --root "$GITHUB_WORKSPACE" \
            --base "$BASE" \
            --head "$HEAD" \
            --time-left "$left" \
            --write sarif "$sarif" \
            --write summary "$GITHUB_STEP_SUMMARY" || status=$?
          echo "::$token::"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -s "$sarif" ]; then echo "sarif=written" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the SARIF as a run artifact
        if: always() && steps.judge.outputs.sarif == 'written'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.clock.outputs.artifact }}
          path: ${{ runner.temp }}/adherence/adherence.sarif
          retention-days: 7

      - name: Verdict
        if: always()
        env:
          STATUS: ${{ steps.judge.outputs.status }}
        run: |
          if [ -z "$STATUS" ]; then
            echo "adherence: the judgement did not run" >&2
            exit 1
          fi
          exit "$STATUS"
