# adherence.yml -- reusable workflow: the architectural adherence gate.
# Judges a change's head against its base with the adherence engine
# (`bin/adhere --stage ci judge`), uploads the findings as SARIF to code
# scanning, so they annotate the pull request at the line, and writes the
# verdict, findings, notices and coverage to the job summary.
# Design: docs/design/DESIGN.ARCH-ADHERENCE.md; architecture:
# docs/design/ARCHITECTURE.ARCH-ADHERENCE.md (Where it runs, Persistence,
# Security mitigations, Operability).
#
# Two jobs, so each holds only what it needs:
#
#   judge    contents: read and pull-requests: read. Fetches the engine at
#            `tools_ref`, checks the repository out at the head with full
#            history, installs the analyzers from their locks (uv.lock with
#            --frozen, node/package-lock.json with npm ci --ignore-scripts), and
#            runs one judgement that prints the report to the log and writes
#            the SARIF file and the job summary. The ci stage reads the
#            job's GITHUB_TOKEN for the reviews that settle which landed
#            adherence.toml is in force, and the hosted judge's
#            DECIDE_GATEWAY_URL and DECIDE_GATEWAY_TOKEN when the caller
#            supplies them (without them the judged checks are coverage and
#            the verdict is inconclusive at best), and the ledger's
#            configuration and credentials when the caller supplies them
#            (Reports, below). The engine hands every analyzer an
#            allowlisted environment (PATH, LANG, and HOME and TMPDIR set to
#            a scratch directory), so no token or credential reaches one;
#            only the decide client gets the judge's token, as its own
#            configuration, and only the warehouse adapter the ledger's. The verdict sets the job's exit status last:
#            lowered and not run fail, and inconclusive passes (the
#            design's Key Decisions, Inconclusive at the gate); the SARIF
#            is uploaded first either way.
#   upload   contents: read, security-events: write, and actions: read
#            (code scanning asks for it in a private repository). Runs
#            nothing but the pinned upload-sarif action over the judge
#            job's file. Skipped for a pull request from a fork, whose token
#            cannot write code scanning, and when the caller passes
#            `upload_sarif: false`: a private repository without Code
#            Security enabled refuses the upload ("Code Security must be
#            enabled for this repository to use code scanning"), which
#            would fail the call over a presentation step while the judge
#            job, which carries the verdict, passed (template-tools
#            PR#1058, 2026-11-06). Code scanning keeps one analysis
#            per ref, sha and `category`, so two calls on one head (two
#            callers' jobs, a matrix) must pass distinct `category` inputs,
#            or the second upload replaces the first.
#
# The bound: the ci stage has no deadline of its own. The judge step passes
# the job's remaining time -- `timeout_minutes` less the time already spent
# and a margin for the steps after it -- as `--time-left`; checks unfinished
# by then are coverage, never a pass.
#
# The base: by default, for a pull request, the merge-base of the head and
# the pull request's base, so a change is judged on what it did and not on
# what landed beside it; for a push, the tip the push replaced
# (`github.event.before`); for a new branch's first push or another event,
# the merge-base with the default branch. When none can be found (a force
# push whose old tip is not fetched, the default branch's first push) the
# job fails and says so rather than judge an empty change. A caller may
# name `base` and `head` instead (tedium's staging commit, say).
#
# Reports: ci keeps each report in the runner's per-user file cache, and
# reads no base back from it. When the caller passes the adherence-ledger
# warehouse's four secrets (ADHERENCE_LEDGER_ENDPOINT, _BUCKET,
# _ACCESS_KEY_ID and _SECRET_ACCESS_KEY, the data warehouse's credential
# chain; `ledger_region` defaults to R2's `auto`), every run also writes
# the report's scan key to the warehouse, and a base is read back from the
# warehouse's lookup key, which only a default-branch run writes. That
# run's lookup-write credential (ADHERENCE_LEDGER_LOOKUP_ACCESS_KEY_ID and
# _SECRET_ACCESS_KEY) is a secret of the GitHub environment the caller
# names in `ledger_environment`, restricted to the default branch: the
# judge job enters that environment, and hands the engine those two, only
# on a push to the default branch. Without the four, or until tds-internal
# Issue#276 provisions the bucket, the report carries a notice that it was
# kept in the file cache only, and the base is always measured again.
# Endpoint and bucket are secrets, not variables, as the warehouse record
# has them.
#
# Hosted here because a public repository's reusable workflow can be called
# from both owners (the review-settled.yml and ocr-review.yml precedent).
# The engine is fetched at `tools_ref`: a reusable workflow cannot learn the
# commit it was called at, so the caller passes that commit again, and pins
# `uses:` and `tools_ref` together (the same SHA; tds-utils Issue#453 names
# the cost of two pins).
#
# Caller shape (this repository calls it from the `adherence-judge` job in
# dist-ci.yml, with `uses: ./.github/workflows/adherence.yml`):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   jobs:
#     adherence:
#       uses: 9atatimer/tds-utils/.github/workflows/adherence.yml@<sha>
#       permissions:
#         contents: read
#         pull-requests: read
#         security-events: write
#         actions: read
#       with:
#         tools_ref: <the same sha>
#         upload_sarif: false   # only a private repository without Code Security
#       secrets:
#         DECIDE_GATEWAY_TOKEN: ${{ secrets.DECIDE_GATEWAY_TOKEN }}
#         ADHERENCE_LEDGER_ENDPOINT: ${{ secrets.ADHERENCE_LEDGER_ENDPOINT }}
#         ADHERENCE_LEDGER_BUCKET: ${{ secrets.ADHERENCE_LEDGER_BUCKET }}
#         ADHERENCE_LEDGER_ACCESS_KEY_ID: ${{ secrets.ADHERENCE_LEDGER_ACCESS_KEY_ID }}
#         ADHERENCE_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.ADHERENCE_LEDGER_SECRET_ACCESS_KEY }}
#
# (each optional), with `ledger_environment: <environment>` under `with:`
# when the lookup-write credential is provisioned there -- a caller that
# also runs on push to the default branch, so that run writes the base.
#
# and the caller owner's variables CI_RUNS_ON (optional runner pool) and
# DECIDE_GATEWAY_URL (optional, with the secret: the hosted judge). Adoption
# also requires (architecture, Operability): an adherence.toml landed with
# the owner's approval, CODEOWNERS entries naming users for adherence.toml,
# the caller workflow and its pins, and branch protection that requires
# code-owner review and this check by name; the job joins `gate`'s `needs`
# only after one green run.
#
# The ci-magic toolkit line (template-tools DESIGN.CI-MAGIC-TOOLKIT.md): a
# repository whose ci.magic judge should quote the measurement adds, to its
# base-sourced .github/scripts/ci-magic-toolkit,
#
#   adherence  bin/adhere measure --json
#
# here, where bin/adhere is in the repository; elsewhere the argv names the
# launcher where that job put tds-utils. It is a program and its fixed
# arguments, never an interpreter, and `measure` binds the laptop stage,
# which asks no judge without the door's address.
#
# Caller-controlled text (inputs, refs) reaches a script only through env:,
# never through an expression inside a run: block.

name: adherence

on:
  workflow_call:
    inputs:
      tools_ref:
        description: The tds-utils commit to run the engine from; the same SHA the caller pins this workflow at.
        type: string
        required: true
      base:
        description: The revision judged against; empty is the merge-base of the head and the pull request's base, on a push the tip it replaced, else the merge-base with the default branch.
        type: string
        required: false
        default: ''
      head:
        description: The revision judged; empty is the pull request's head, or the pushed commit.
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: The judge job's timeout; the judgement is bounded by what is left of it.
        type: number
        required: false
        default: 9
      ledger_region:
        description: The adherence-ledger warehouse's region; empty is R2's `auto`.
        type: string
        required: false
        default: ''
      ledger_environment:
        description: The GitHub environment, restricted to the default branch, holding the lookup-write credential; the judge job enters it only on a push to the default branch. Empty writes no lookup key.
        type: string
        required: false
        default: ''
      category:
        description: The code scanning category the SARIF is uploaded under; two calls on one head need distinct categories, or the second replaces the first.
        type: string
        required: false
        default: adherence
      upload_sarif:
        description: Whether the upload job runs; false for a private repository without Code Security enabled, where code scanning refuses the upload. The judge job and its verdict run either way.
        type: boolean
        required: false
        default: true
    secrets:
      DECIDE_GATEWAY_TOKEN:
        description: The hosted judge's token (with the DECIDE_GATEWAY_URL variable); without it the judged checks are coverage.
        required: false
      ADHERENCE_LEDGER_ENDPOINT:
        description: The adherence-ledger warehouse's S3 endpoint; with the bucket and the scan credential, reports are written to the warehouse.
        required: false
      ADHERENCE_LEDGER_BUCKET:
        description: The adherence-ledger warehouse's bucket.
        required: false
      ADHERENCE_LEDGER_ACCESS_KEY_ID:
        description: The scan credential's access key id, scoped to this repository's scan prefix (write) and lookup prefix (read).
        required: false
      ADHERENCE_LEDGER_SECRET_ACCESS_KEY:
        description: The scan credential's secret.
        required: false
      ADHERENCE_LEDGER_LOOKUP_ACCESS_KEY_ID:
        description: The lookup-write credential's access key id; read from the `ledger_environment` environment on a push to the default branch, never passed by a caller.
        required: false
      ADHERENCE_LEDGER_LOOKUP_SECRET_ACCESS_KEY:
        description: The lookup-write credential's secret, as above.
        required: false

permissions:
  contents: read

jobs:
  judge:
    name: judge
    # The caller's CI_RUNS_ON pool when set, else hosted; a pull request
    # from a fork always runs hosted.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # The environment holding the lookup-write credential, entered only by a
    # push to the default branch; every other run enters none.
    environment: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.ledger_environment || '' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.judge.outputs.status }}
      sarif: ${{ steps.judge.outputs.sarif }}
      head: ${{ steps.revisions.outputs.head }}
      ref: ${{ steps.revisions.outputs.ref }}
      artifact: ${{ steps.clock.outputs.artifact }}
    steps:
      # The SARIF artifact's name is this call's own: a run that calls the
      # workflow twice (two callers' jobs, a matrix) gets two names, so one
      # upload neither collides with nor fetches the other's file.
      - name: Start the clock
        id: clock
        run: |
          {
            echo "started=$(date +%s)"
            echo "artifact=adherence-sarif-$GITHUB_RUN_ATTEMPT-$(od -An -tx1 -N8 /dev/urandom | tr -d ' \n')"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 9atatimer/tds-utils
          ref: ${{ inputs.tools_ref }}
          path: .adherence-tools
          persist-credentials: false
          sparse-checkout: |
            bin/adhere
            bin/decide
            lib/decide
            adherence
          sparse-checkout-cone-mode: false

      # Checking the repository out clears the workspace, and the engine and
      # its environment must not sit inside the checkout it measures.
      - name: Stage the engine
        run: mv .adherence-tools "$RUNNER_TEMP/adherence-tools"

      # Full history: the base, the head and the history of adherence.toml.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The workspace now holds the untrusted head, so neither setup action
      # may read it: uv's version is pinned here rather than taken from a
      # `required-version` the head could carry, its cache (whose glob and
      # directory setup-uv would read from the workspace) is off, and its
      # working directory is the staged engine; setup-node's automatic npm
      # cache, which reads the workspace's package.json, is off too.
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.19'
          enable-cache: false
          working-directory: ${{ runner.temp }}/adherence-tools/adherence

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # The analyzers are pinned by hash: a lock that disagrees fails here,
      # and no package's install script runs. It runs in the staged engine,
      # so no configuration file of the head's is discovered from the
      # working directory.
      - name: Install the analyzers
        working-directory: ${{ runner.temp }}/adherence-tools/adherence
        run: |
          uv sync --frozen --no-dev --project "$RUNNER_TEMP/adherence-tools/adherence"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/adherence-tools/adherence/node"

      - name: Resolve the revisions
        id: revisions
        env:
          BASE_INPUT: ${{ inputs.base }}
          HEAD_INPUT: ${{ inputs.head }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          no_base() {
            echo "adherence: no base to judge $head against: $1; name one with the base input" >&2
            exit 1
          }
          head="${HEAD_INPUT:-${PR_HEAD:-$GITHUB_SHA}}"
          head="$(git rev-parse --verify "${head}^{commit}")"
          if [ -n "$BASE_INPUT" ]; then
            base="$(git rev-parse --verify "${BASE_INPUT}^{commit}")"
          elif [ -n "$PR_BASE" ]; then
            base="$(git merge-base "$PR_BASE" "$head")" ||
              no_base "the pull request's base $PR_BASE shares no history with it"
          elif [ -n "$PUSH_BEFORE" ] && [ -n "${PUSH_BEFORE//0/}" ]; then
            # A push is judged against the tip it replaced; the merge-base
            # with the default branch would be the head itself there.
            base="$(git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}")" ||
              no_base "the pushed-over tip $PUSH_BEFORE is not in the fetched history (a force push?)"
          else
            # A new branch (before is all zeros) or another event: the
            # merge-base with the default branch.
            git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" >/dev/null ||
              no_base "the default branch origin/$DEFAULT_BRANCH is not fetched"
            base="$(git merge-base "origin/$DEFAULT_BRANCH" "$head")" ||
              no_base "it shares no history with origin/$DEFAULT_BRANCH"
            if [ "$base" = "$head" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              no_base "it is the tip of the default branch and no earlier tip was pushed over"
            fi
          fi
          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/$PR_NUMBER/head"
          else
            ref="$GITHUB_REF"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "judging $head against $base"

      # The report is author-controlled text: the engine labels every log
      # line and strips control characters, and workflow commands are off
      # while it runs, so no line of it can act on the job.
      - name: Judge the change
        id: judge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DECIDE_GATEWAY_URL: ${{ vars.DECIDE_GATEWAY_URL }}
          DECIDE_GATEWAY_TOKEN: ${{ secrets.DECIDE_GATEWAY_TOKEN }}
          ADHERENCE_LEDGER_ENDPOINT: ${{ secrets.ADHERENCE_LEDGER_ENDPOINT }}
          ADHERENCE_LEDGER_BUCKET: ${{ secrets.ADHERENCE_LEDGER_BUCKET }}
          ADHERENCE_LEDGER_REGION: ${{ inputs.ledger_region }}
          ADHERENCE_LEDGER_ACCESS_KEY_ID: ${{ secrets.ADHERENCE_LEDGER_ACCESS_KEY_ID }}
          ADHERENCE_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.ADHERENCE_LEDGER_SECRET_ACCESS_KEY }}
          # The lookup-write pair, only in the default branch's environment.
          ADHERENCE_LEDGER_LOOKUP_ACCESS_KEY_ID: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.ledger_environment != '') && secrets.ADHERENCE_LEDGER_LOOKUP_ACCESS_KEY_ID || '' }}
          ADHERENCE_LEDGER_LOOKUP_SECRET_ACCESS_KEY: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.ledger_environment != '') && secrets.ADHERENCE_LEDGER_LOOKUP_SECRET_ACCESS_KEY || '' }}
          UV_FROZEN: '1'
          BASE: ${{ steps.revisions.outputs.base }}
          HEAD: ${{ steps.revisions.outputs.head }}
          STARTED: ${{ steps.clock.outputs.started }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          # Seconds kept back for the steps after this one.
          MARGIN_SECONDS: '60'
        run: |
          set -uo pipefail
          sarif="$RUNNER_TEMP/adherence/adherence.sarif"
          mkdir -p "$(dirname "$sarif")"
          left=$(( TIMEOUT_MINUTES * 60 - ($(date +%s) - STARTED) - MARGIN_SECONDS ))
          if [ "$left" -lt 0 ]; then left=0; fi
          token="$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          status=0
          "$RUNNER_TEMP/adherence-tools/bin/adhere" --stage ci judge \
            --root "$GITHUB_WORKSPACE" \
            --base "$BASE" \
            --head "$HEAD" \
            --time-left "$left" \
            --write sarif "$sarif" \
            --write summary "$GITHUB_STEP_SUMMARY" || status=$?
          echo "::$token::"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -s "$sarif" ]; then echo "sarif=written" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the SARIF for the upload job
        if: always() && steps.judge.outputs.sarif == 'written'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.clock.outputs.artifact }}
          path: ${{ runner.temp }}/adherence/adherence.sarif
          retention-days: 7

      - name: Verdict
        if: always()
        env:
          STATUS: ${{ steps.judge.outputs.status }}
        run: |
          if [ -z "$STATUS" ]; then
            echo "adherence: the judgement did not run" >&2
            exit 1
          fi
          exit "$STATUS"

  upload:
    name: upload SARIF
    needs: [judge]
    if: always() && inputs.upload_sarif && needs.judge.outputs.sarif == 'written' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Fetch the SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.judge.outputs.artifact }}
          path: ${{ runner.temp }}/adherence

      # Results land on the head that was judged, so the annotations sit on
      # the lines of the pull request's own commits.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/adherence/adherence.sarif
          category: ${{ inputs.category }}
          ref: ${{ needs.judge.outputs.ref }}
          sha: ${{ needs.judge.outputs.head }}
