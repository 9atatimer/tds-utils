# ocr-review.yml -- reusable workflow: OCR on Demand. Runs Alibaba's Open
# Code Review (ocr) over one pull request when a collaborator comments /ocr
# or anyone with write access dispatches it, with completions from the
# laptop's model through the Ollama Gateway, or -- when the owner's
# OCR_BACKEND variable or a dispatch says cf-ai-gateway -- from Cloudflare AI
# Gateway (Issue#481).
# Design: docs/design/OCR-ON-DEMAND.DESIGN.md (APPROVED); runbook:
# docs/ops/ocr-review.md.
#
# The core guarantee: a review is never a silent false negative. Every run
# that is not skipped writes a run record (job summary + artifact) and, but
# for pr-not-open, one summary comment of this workflow's saying what was
# reviewed or why nothing was. The pinned upstream action also keeps its own
# sticky summary on the PR, which cannot be turned off and names the
# findings that failed to post; ours links it (Key Decisions, option A).
#
# Three jobs, each on the caller's CI_RUNS_ON runner pool when the caller
# sets that variable (a called workflow reads the caller's vars), else on a
# GitHub-hosted runner, and each under the pool's 10-minute container
# ceiling:
#
#   authorize  references no secret and runs nothing from the PR: skip
#              (not /ocr, or not a collaborator), fail (pr-not-open, fork)
#              or approve. The review job needs its approval, so the job
#              that loads credentials never starts for an unauthorized
#              trigger (G2).
#   review     the only job that references the secret. Checks the
#              runner's host tools first (git; the 1Password CLI is used
#              from the runner when it has one, installed otherwise, which
#              needs gpg and unzip; a missing one is runner-tool-missing,
#              tds-utils#446). Resolves the
#              gateway credential from 1Password (each value masked the
#              moment it is read), probes the gateway (G5), runs the
#              upstream action pinned by SHA with an exact ocr version,
#              then the no-false-negative verdict (G4).
#   report     references no secret. Runs after both whatever their
#              outcome, cancellation included, unless the run was skipped:
#              the run record first, then the summary comment.
#
# Hosted here because a reusable workflow in a public repo can be called
# from both owners (the review-settled.yml precedent). The workflow names no
# hostname, vault or item: those arrive as the caller owner's variables
# OCR_BACKEND, and the chosen backend's OLLAMA_GATEWAY_OP_ITEM, _URL and
# _MODEL or CF_AI_GATEWAY_OP_ITEM, _URL and _MODEL.
#
# The step commands are bin/ocr-review (decisions in lib/ocr-review/),
# fetched at `tools_ref`. A reusable workflow cannot learn the commit it was
# called at, so the caller passes that commit again as tools_ref; the
# caller template sets both to the same SHA and bin/seed-ocr-review status
# flags a mismatch.
#
# PR-controlled text (comment bodies, branch names, paths, findings)
# reaches a script only through env: or files, never through an expression
# inside a run: block -- every job holds a GITHUB_TOKEN with write scopes.

name: ocr-review

on:
  workflow_call:
    inputs:
      pr:
        description: The pull request number (the issue number on a comment trigger).
        type: number
        required: true
      model:
        description: Model override, dispatch only; empty uses the chosen backend's model variable.
        type: string
        required: false
        default: ''
      backend:
        description: Backend override, dispatch only (ollama-gateway or cf-ai-gateway); empty uses the owner's OCR_BACKEND, else ollama-gateway.
        type: string
        required: false
        default: ''
      tools_ref:
        description: The tds-utils commit to run the step commands from; the same SHA the caller pins this workflow at.
        type: string
        required: true
    secrets:
      OLLAMA_GATEWAY_OP_SA_TOKEN:
        description: The 1Password service-account token that reads the gateway caller item.
        # Not required at call time: a missing secret must fail the run as
        # `configuration`, with a record and a comment, not refuse the call.
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  authorize:
    name: authorize
    # A cheap prefilter so an ordinary PR comment costs no runner. It is not
    # the decision: startsWith is case-insensitive here, and the exact
    # prefix and the author association are judged by the Authorize step.
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/ocr')
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 3
    outputs:
      decision: ${{ steps.authorize.outputs.decision }}
      cause: ${{ steps.authorize.outputs.cause }}
      reason: ${{ steps.authorize.outputs.reason }}
      trigger: ${{ steps.authorize.outputs.trigger }}
      pr: ${{ inputs.pr }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_ref: ${{ steps.authorize.outputs.base_ref }}
      started_at: ${{ steps.authorize.outputs.started_at }}
      tools: ${{ steps.tools.outcome }}
      node: ${{ steps.node.outcome }}
      authorize: ${{ steps.authorize.outcome }}
      ack_reaction_id: ${{ steps.ack.outputs.reaction_id }}
    steps:
      - name: Fetch the tools
        id: tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 9atatimer/tds-utils
          ref: ${{ inputs.tools_ref }}
          path: .ocr-review-tools
          persist-credentials: false
          sparse-checkout: |
            bin/ocr-review
            lib/ocr-review
          sparse-checkout-cone-mode: false

      - name: Set up Node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Authorize
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          PR: ${{ inputs.pr }}
        run: node .ocr-review-tools/bin/ocr-review authorize

      # Eyes on an approved /ocr comment, before the review job starts; the
      # report job replaces it with the outcome. Nothing for a dispatch or
      # a skipped comment. Ambient token only; it may never fail the run.
      - name: Acknowledge the comment
        id: ack
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DECISION: ${{ steps.authorize.outputs.decision }}
        run: node .ocr-review-tools/bin/ocr-review ack

  review:
    name: review
    needs: [authorize]
    if: needs.authorize.outputs.decision == 'approve'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Under the pool's 10-minute ceiling. The probe alone may retry a cold
    # model for 6 minutes, which leaves little for the review itself; the
    # pilot (task-051) measures a real review against this.
    timeout-minutes: 9
    env:
      # ocr's npm launcher otherwise checks the registry and upgrades itself,
      # defeating the exact pin; telemetry and raw request capture are off
      # explicitly, not by default.
      OCR_NO_UPDATE: '1'
      OCR_ENABLE_TELEMETRY: '0'
      OCR_RAW_LOGGING: '0'
      OCR_CONTENT_LOGGING: '0'
    outputs:
      tools: ${{ steps.tools.outcome }}
      node: ${{ steps.node.outcome }}
      stage: ${{ steps.stage.outcome }}
      hosttools: ${{ steps.hosttools.outcome }}
      hosttools_cause: ${{ steps.hosttools.outputs.cause }}
      hosttools_detail: ${{ steps.hosttools.outputs.detail }}
      opcli: ${{ steps.opcli.outcome }}
      creds: ${{ steps.creds.outcome }}
      creds_cause: ${{ steps.creds.outputs.cause }}
      creds_detail: ${{ steps.creds.outputs.detail }}
      model: ${{ steps.creds.outputs.model }}
      backend: ${{ steps.creds.outputs.backend }}
      probe: ${{ steps.probe.outcome }}
      probe_cause: ${{ steps.probe.outputs.cause }}
      probe_detail: ${{ steps.probe.outputs.detail }}
      ocr: ${{ steps.ocr.outcome }}
      ocr_cause: ${{ steps.verdict.outputs.review_cause }}
      ocr_detail: ${{ steps.verdict.outputs.review_detail }}
      verdict: ${{ steps.verdict.outcome }}
      verdict_cause: ${{ steps.verdict.outputs.cause }}
      verdict_detail: ${{ steps.verdict.outputs.detail }}
      upload_result: ${{ steps.upload_result.outcome }}
      upload_state: ${{ steps.upload_state.outcome }}
      # Upstream's own sticky summary, which names the findings that failed
      # to post; the report job's comment links it. Empty when the action
      # posted none.
      upstream_summary_url: ${{ steps.ocr.outputs.summary_comment_url }}
    steps:
      - name: Fetch the tools
        id: tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 9atatimer/tds-utils
          ref: ${{ inputs.tools_ref }}
          path: .ocr-review-tools
          persist-credentials: false
          sparse-checkout: |
            bin/ocr-review
            lib/ocr-review
          sparse-checkout-cone-mode: false

      - name: Set up Node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The upstream action checks the reviewed repository out into the
      # workspace and clears whatever is there, so the tools move out first.
      - name: Stage the tools
        id: stage
        run: cp -R .ocr-review-tools "$RUNNER_TEMP/ocr-review-tools"

      # Before any credential: which of git, unzip, gpg and op the runner
      # has. The cf-pool image bakes in a verified op, so it is used as is
      # and nothing is downloaded at run time; a GitHub-hosted runner has
      # none, so the pinned action installs it, which needs gpg and unzip.
      # A tool the chosen path needs that is absent fails the run
      # runner-tool-missing, naming it (tds-utils#446).
      - name: Check the host tools
        id: hosttools
        run: node "$RUNNER_TEMP/ocr-review-tools/bin/ocr-review" host-tools

      - name: Install the 1Password CLI
        id: opcli
        if: steps.hosttools.outputs.install_op == 'true'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.40.0

      # The one step that references the secret. Each value read from the
      # item is registered for masking before the step writes anything.
      - name: Credentials
        id: creds
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OLLAMA_GATEWAY_OP_SA_TOKEN }}
          OCR_BACKEND: ${{ vars.OCR_BACKEND }}
          BACKEND_OVERRIDE: ${{ inputs.backend }}
          OLLAMA_GATEWAY_OP_ITEM: ${{ vars.OLLAMA_GATEWAY_OP_ITEM }}
          OLLAMA_GATEWAY_URL: ${{ vars.OLLAMA_GATEWAY_URL }}
          OLLAMA_GATEWAY_MODEL: ${{ vars.OLLAMA_GATEWAY_MODEL }}
          CF_AI_GATEWAY_OP_ITEM: ${{ vars.CF_AI_GATEWAY_OP_ITEM }}
          CF_AI_GATEWAY_URL: ${{ vars.CF_AI_GATEWAY_URL }}
          CF_AI_GATEWAY_MODEL: ${{ vars.CF_AI_GATEWAY_MODEL }}
          MODEL_OVERRIDE: ${{ inputs.model }}
          TRIGGER: ${{ needs.authorize.outputs.trigger }}
        run: node "$RUNNER_TEMP/ocr-review-tools/bin/ocr-review" credentials

      - name: Probe
        id: probe
        env:
          GATEWAY_URL: ${{ steps.creds.outputs.url }}
          API_BASE: ${{ steps.creds.outputs.api_base }}
          BACKEND: ${{ steps.creds.outputs.backend }}
          MODEL: ${{ steps.creds.outputs.model }}
          HEADERS_FILE: ${{ steps.creds.outputs.headers_file }}
        run: node "$RUNNER_TEMP/ocr-review-tools/bin/ocr-review" probe

      # alibaba/open-code-review v1.12.13. The gateway authenticates by the
      # item's headers; llm_auth_token is a required input ocr sends as the
      # Authorization bearer, so it carries the backend's fixed non-secret
      # placeholder. The API base, the placeholder and the request body are
      # the chosen backend's profile (lib/ocr-review/gateway.mjs): on the
      # Ollama Gateway the body streams, so a long completion's first byte
      # reaches the edge before its time-to-first-byte limit, and turns
      # reasoning off through reasoning_effort "none", which is all the
      # gateway's ollama obeys (Issue#479). Upstream's own artifact upload is off: it
      # would publish ocr's stderr log too. Its own summary comment stays:
      # it cannot be turned off at this pin, and it is where the findings
      # that failed to post are named (Key Decisions, option A). Sticky, so
      # it is updated in place rather than added each run.
      - name: Review
        id: ocr
        uses: alibaba/open-code-review@fabbdb296b0d97e2140ada8d54ca7d6d6d1d7ad4 # v1.12.13
        with:
          llm_url: ${{ steps.creds.outputs.api_base }}
          llm_auth_token: ${{ steps.creds.outputs.auth_token }}
          llm_model: ${{ steps.creds.outputs.model }}
          llm_use_anthropic: 'false'
          llm_protocol: openai
          llm_extra_headers: ${{ steps.creds.outputs.extra_headers }}
          llm_extra_body: ${{ steps.creds.outputs.extra_body }}
          ocr_version: '1.12.13'
          pr_number: ${{ needs.authorize.outputs.pr }}
          head_sha: ${{ needs.authorize.outputs.head_sha }}
          base_ref: ${{ needs.authorize.outputs.base_ref }}
          stream_progress: 'false'
          upload_artifacts: 'false'
          sticky_summary: 'true'
          checkpoint_range: 'false'
          incremental: 'false'
          resolve_outdated: 'false'

      # Runs after the review whether it passed or failed: it marks an ocr
      # exit as engine-error, and judges a completed review (G4) by the
      # action's post counts -- at this pin it reports post outcomes only as
      # counts (Key Decisions, per-finding post status). An output the
      # action did not set arrives empty and is engine-error, never zero.
      - name: Verdict
        id: verdict
        if: always() && steps.ocr.outcome != 'skipped'
        env:
          OCR_STEP_OUTCOME: ${{ steps.ocr.outcome }}
          OCR_RESULT_PATH: /tmp/ocr-result.json
          OCR_COMMENTS_TOTAL: ${{ steps.ocr.outputs.comments_total }}
          OCR_COMMENTS_INLINE: ${{ steps.ocr.outputs.comments_inline }}
          OCR_COMMENTS_ROUTED: ${{ steps.ocr.outputs.comments_routed }}
          OCR_COMMENTS_SKIPPED: ${{ steps.ocr.outputs.comments_skipped }}
          OCR_COMMENTS_FAILED: ${{ steps.ocr.outputs.comments_failed }}
        run: node "$RUNNER_TEMP/ocr-review-tools/bin/ocr-review" verdict

      # G8: ocr's JSON result (--audience agent), for an LLM to act on.
      - name: Upload the ocr result
        id: upload_result
        if: always() && steps.ocr.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-result-${{ github.run_attempt }}
          path: /tmp/ocr-result.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the review state
        id: upload_state
        if: always() && steps.verdict.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-review-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-review-state/state.json
          if-no-files-found: ignore
          retention-days: 1

  report:
    name: report
    needs: [authorize, review]
    if: always() && needs.authorize.result != 'skipped' && needs.authorize.outputs.decision != 'skip'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Note a cancelled run
        if: cancelled()
        run: echo "RUN_CANCELLED=true" >> "$GITHUB_ENV"

      - name: Fetch the tools
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 9atatimer/tds-utils
          ref: ${{ inputs.tools_ref }}
          path: .ocr-review-tools
          persist-credentials: false
          sparse-checkout: |
            bin/ocr-review
            lib/ocr-review
          sparse-checkout-cone-mode: false

      - name: Set up Node
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Fetch the review state
        if: always() && needs.review.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-review-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-review-state

      # Written first, to the job summary and a file, so nothing later in
      # this job can lose it.
      - name: Build the run record
        id: record
        if: always()
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          AUTHORIZE_OUTPUTS: ${{ toJSON(needs.authorize.outputs) }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_OUTPUTS: ${{ toJSON(needs.review.outputs) }}
          OCR_VERSION: '1.12.13'
          STATE_PATH: ${{ runner.temp }}/ocr-review-state/state.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECORD_PATH: ${{ runner.temp }}/ocr-review-record/ocr-review-record.json
          COMMENT_PATH: ${{ runner.temp }}/ocr-review-comment.md
        run: node .ocr-review-tools/bin/ocr-review report

      - name: Upload the run record
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-review-record-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-review-record/ocr-review-record.json
          retention-days: 90

      # One per run from this workflow, per the State Machine table (none
      # for pr-not-open), beside upstream's sticky summary. A failed post
      # fails this job, so the run concludes red; the record is already
      # written.
      - name: Post the summary comment
        if: always() && steps.record.outputs.should_comment == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          COMMENT_PATH: ${{ runner.temp }}/ocr-review-comment.md
        run: node .ocr-review-tools/bin/ocr-review comment

      # On a comment-triggered run: +1 (success) or -1 (failure, cancelled)
      # on the /ocr comment, then the authorize job's eyes comes off, by
      # the id it recorded. Nothing for a dispatch; never fails the run.
      - name: React with the outcome
        if: always() && steps.record.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          OUTCOME: ${{ steps.record.outputs.outcome }}
          ACK_REACTION_ID: ${{ needs.authorize.outputs.ack_reaction_id }}
        run: node .ocr-review-tools/bin/ocr-review react
