# adherence-caller.yml -- this repository's own call of the reusable
# adherence workflow (which lives here too; other repositories call it as
# 9atatimer/tds-utils/.github/workflows/adherence.yml@<sha>, with tools_ref
# set to the same sha).
#
# Judges every same-repository pull request's head against its merge-base
# with the adherence engine, annotates the pull request with the findings
# through code scanning, and writes the job summary. It is NOT in `gate`'s
# `needs` and no ruleset requires it: the architecture's rollout lands it
# there only after one green run here. This repository's adherence.toml
# lands in the same change as this note; the engine reads the declaration
# at the base, so it takes effect from the next change -- its own first run
# is inconclusive because the base has none.
#
# `tools_ref` is the pull request's own head, as `uses:` is this file's
# own copy of the workflow: the two pins move together, and a change to the
# engine is judged by the engine it carries. A pull request from a fork is
# skipped outright, so no fork's head is ever run as the engine. No judge
# token is passed: design Q4 and architecture Q6 (may a pull request's run
# hold the judge's token) are open, so the judged checks here are coverage.

name: adherence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: adherence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adherence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/adherence.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    with:
      tools_ref: ${{ github.event.pull_request.head.sha }}
