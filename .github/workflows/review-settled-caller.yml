# review-settled-caller.yml -- this repo's own call of the reusable
# review-settled workflow (which lives in this repo too; other repos call
# it as 9atatimer/tds-utils/.github/workflows/review-settled.yml@master).
#
# Posts the `review-settled` commit status on every PR head: green iff
# Copilot's newest review is on the current head and every review thread
# is resolved. The ruleset requires it; tedium checks it in `pr_status`.
#
# Why these events: GitHub has no workflow trigger for a review thread
# being resolved (pull_request_review_thread is a webhook, not a
# workflow event). What does fire on the way to a settled review is the
# review itself, the reply in a thread, and the PR comment the reviewer
# posts after resolving (the self-review epilogue the gates skill
# requires) -- so all three re-evaluate, and workflow_dispatch covers a
# stuck one by hand. A review request is the one event whose run waits
# for the reviewer's answer (`wait_seconds` below); every other run posts
# at once.
#
# Part of the contract, not a gap to close: a thread UNRESOLVED with no
# comment fires nothing either, so a green status can outlive it until
# the next event on the PR. The gates skill has every reopen carry a
# reply (that reply re-evaluates), a `tedium land` comment re-evaluates
# before the batch is judged, and the human who reopens a thread without
# a word is the backstop this status is designed around, not a case it
# can see.
#
# `tools_ref` is the PR's own head so a change to the checker is tested
# by the PR that carries it, not by the one after. The caller itself is
# only half testable that way: GitHub runs a `pull_request` workflow from
# the PR's copy of this file, but an `issue_comment` workflow from the
# default branch's copy. A PR that changes this file sees its own change on
# push and review events, and master's behaviour on every comment, until it
# merges (a comment run on PR #493 waited master's 180s while the PR's copy
# said 0).

name: review-settled

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate
        type: number
        required: true

concurrency:
  group: review-settled-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  # Only a push or a review request supersedes whatever is running: the
  # head changed, or the wait is about to start. No other event cancels --
  # it would kill the one run waiting for Copilot's answer and replace it
  # with a run that waits 0 and posts "no review yet" over an answer
  # seconds away (issue #353). The self-review epilogue comment lands
  # inside that window, and so does the `opened` run of a PR created with
  # its reviewer attached: GitHub delivers `opened` and `review_requested`
  # unordered, so `opened` must not cancel either. Every other run queues
  # and re-evaluates after the waiter posts.
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event.action == 'review_requested' }}

permissions:
  contents: read

jobs:
  review-settled:
    # issue_comment also fires for plain issues; only PR comments matter.
    # A PR from a fork is skipped outright: its token is read-only (no
    # status could be posted anyway) and `tools_ref` below would otherwise
    # check out and run an untrusted head. Fork PRs are human-merge. This
    # guard can only see the head repo on events that carry a pull_request
    # payload; on issue_comment `tools_ref` is master (trusted) and the
    # checker itself refuses a fork PR from the API's isCrossRepository.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
      && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/review-settled.yml
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    with:
      # Any-of group: a review on head from Copilot OR Codex settles it
      # (Copilot has no quota; owner ruling 2026-09-27).
      reviewers: 'copilot-pull-request-reviewer|chatgpt-codex-connector'
      pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      # Fail fast on every event except a review request: Copilot's answer
      # fires no workflow, so the run its request starts is the one that
      # waits for it (PR #356 shows the event firing for a Copilot request).
      # Codex's answer (a review or a comment) fires an event of its own and
      # needs no wait. A push cancels the waiting run through the
      # concurrency group; a comment queues behind it. If tds-internal's
      # `automatic_copilot_code_review` is ever enabled for this repo,
      # Copilot re-reviews a push with NO review_requested event, and
      # `synchronize` needs the wait back.
      wait_seconds: ${{ github.event.action == 'review_requested' && 180 || 0 }}
      tools_ref: ${{ github.event.pull_request.head.sha || 'master' }}
