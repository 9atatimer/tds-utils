# MCP server names omp must not start. omp discovers Claude Code's MCP
# servers (~/.claude.json) and plugin servers (named <plugin>:<server>)
# on its own; this list is added to omp's user-level disabledServers in
# ~/.omp/agent/mcp.json. One name per line, # for comments.
#
# omp reads disabledServers from the user file only, so the list is
# global, not per project: shadowing this hook with a zero-byte file stops
# new additions but does not re-enable a name. Re-enable one with omp's
# enabledServers, or remove it from both this file and ~/.omp/agent/mcp.json.

# Claude Code's Telegram channel. Telegram lets one client poll a bot; a
# second poller (omp) takes the channel away from the Claude session, and
# omp cannot act on inbound channel messages anyway.
telegram:telegram

# Same default as clai.d/claude/pre/10-disable-cloudflare-mcp.
cloudflare-graphql
cloudflare-casb
cloudflare-bindings
cloudflare-audit
