# ollama-gateway.cfg -- the Ollama Gateway's route on the LMDE proxy layer,
# "the deadline proxy" (docs/design/OLLAMA-GATEWAY.DESIGN.md, Deadline
# proxy; Key Decisions Q10, Q12). Installed by the gateway's setup.sh as
# routes/ollama-gateway.cfg; the layer's launcher exports gateway.env
# (routes/ollama-gateway.env) plus LMDE_PROXY_ROUTES and LMDE_PROXY_RUN.
#
#   caller (cloudflared) -> 127.0.0.1:${OLLAMA_GATEWAY_PROXY_PORT}   deadline hop
#                        -> unix@${LMDE_PROXY_RUN}/ollama-gateway.sock  hold hop
#                        -> 127.0.0.1:${OLLAMA_GATEWAY_OLLAMA_PORT}  external ollama
#
# Deadline hop: the route's one loopback listener (Q12). Its first byte to
# the caller always leaves before OLLAMA_GATEWAY_DEADLINE: ollama's own
# response streamed through, or the deadline answer -- HTTP 507, from
# ollama-gateway.deadline.http, the only response the gateway marks
# retryable. Every response carries X-LMDE-Route: ollama-gateway, which
# the healthcheck's drift probe (Q8) looks for through the tunnel.
#
# Hold hop: ollama 0.40 aborts a model load when its requester disconnects,
# so the deadline answer must not hang up on ollama. This hop does not
# abort when its client (the deadline hop) goes away; it keeps the upstream
# request open until ollama answers or OLLAMA_GATEWAY_HOLD passes, so the
# load finishes and the caller's retry finds the model warm. It is a unix
# socket, never a second TCP port the tunnel could be pointed at.
#
# No throttle and no payload cap in the first cut (Q12). Bodies are
# streamed, never buffered to disk, and never logged (Q10).

frontend ollama-gateway
    bind 127.0.0.1:"${OLLAMA_GATEWAY_PROXY_PORT}"
    http-after-response set-header X-LMDE-Route ollama-gateway
    default_backend ollama-gateway-deadline

backend ollama-gateway-deadline
    retries 0
    timeout server "${OLLAMA_GATEWAY_DEADLINE}"
    # Only HAProxy's own server timeout produces a 504 here (ollama never
    # sends one), so this file is exactly the deadline answer.
    errorfile 504 "${LMDE_PROXY_ROUTES}/ollama-gateway.deadline.http"
    server hold "unix@${LMDE_PROXY_RUN}/ollama-gateway.sock"

frontend ollama-gateway-hold
    bind "unix@${LMDE_PROXY_RUN}/ollama-gateway.sock" mode 600
    no option abortonclose
    default_backend ollama-gateway-ollama

backend ollama-gateway-ollama
    no option abortonclose
    retries 0
    # ollama answers 403 to any Host that is not loopback (its DNS-rebinding
    # guard), and the tunnel delivers the public hostname (Issue#444). The
    # route is the only path in, so ollama is shown its own loopback address.
    http-request set-header Host "127.0.0.1:${OLLAMA_GATEWAY_OLLAMA_PORT}"
    timeout server "${OLLAMA_GATEWAY_HOLD}"
    server external-ollama 127.0.0.1:"${OLLAMA_GATEWAY_OLLAMA_PORT}"
