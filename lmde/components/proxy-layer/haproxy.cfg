# haproxy.cfg -- the LMDE proxy layer: the one local reverse proxy every
# laptop service with a public port sits behind (docs/design/
# OLLAMA-GATEWAY.DESIGN.md, Deadline proxy; HAProxy is Adopt in
# lmde/TECH_RADAR.md). Global settings and the defaults every route
# inherits; each tenant's route is its own file in routes/, loaded after
# this one by libexec/launch-proxy.zsh.
#
# launchd supervises the process (com.tds.lmde.proxy-layer): no daemon
# mode, no master-worker, no stats socket.

global
    log stderr format raw daemon info

defaults
    mode http
    log global
    option httplog
    # Errors, timeouts and aborts only: a request line and timings, never
    # a body (Q10). Normal traffic is not logged.
    option dontlog-normal
    timeout connect 2s
    timeout http-request 30s
    timeout client 10m
    timeout server 10m
