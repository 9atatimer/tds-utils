# tedium.toml -- landing rules for the tedium merge bot
# (template-tools packages/naatm-tedium). tedium reads it from the BASE
# branch (master) once template-tools#595 is deployed, so a PR cannot
# rewrite the rules that judge it; until that deploy the bot still reads
# the PR's copy, and CODEOWNERS (a human owner on this file,
# use_codeowners below) is the guard either way.

# The check that must report green on the staging commit tedium builds
# on tedium/merge (and tedium/try for a dryrun): the `gate` job in
# .github/workflows/dist-ci.yml, which needs every other job.
status = ["gate"]

# Commit statuses that must be green on the PR head before it is
# batched. `review-settled` (.github/workflows/review-settled.yml) is
# deliberately NOT listed: Copilot is out of quota, so it can never go
# green, and the owner ruled (2026-09-26) that tedium lands without
# review until it returns. Restore it here when Copilot reviews again.
pr_status = []

# A PR carrying this label is never batched.
block_labels = ["hold"]

# Batches stay small: a red batch bisects, and three is the most a
# bisect resolves in one extra round.
max_batch_size = 3

# Sized to the slowest leg: dist-ci's macOS smoketests run ~10 min plus
# runner queue time; the per-job timeout is 15 min. 45 min covers a slow
# macOS queue without holding the queue an hour on a check that hung.
timeout_sec = 2700

delete_merged_branches = true

# PRs touching the paths CODEOWNERS names need a code-owner approval
# before tedium lands them (the mitigation the go-live survey asked for).
use_codeowners = true
