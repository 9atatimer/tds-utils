[project]
name = "dynomark-daemon"
version = "0.1.0"
description = "Dynomark daemon runtime: live AI filing for native bookmarks (docs/design/DYNOMARK.DESIGN.md)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "click>=8.1",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "contract: runs against the shared contract/v1 golden files or a port contract suite (select with -m contract)",
]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["dynomark_daemon", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
