<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ask Dynomark</title>
    <link rel="stylesheet" href="pages.css" />
    <script type="module" src="chat.js"></script>
  </head>
  <body class="chat">
    <h1>Ask Dynomark</h1>
    <p id="model" class="muted">-</p>
    <section id="attention" hidden>
      <h2>Needs attention</h2>
      <ul id="attention-batches"></ul>
      <ul id="attention-jobs"></ul>
    </section>
    <div id="log"></div>
    <form id="ask-form">
      <textarea id="question" rows="3" placeholder="Ask about your bookmarks"></textarea>
      <p><button id="ask" type="submit">Ask</button> <span id="message"></span></p>
    </form>
  </body>
</html>
